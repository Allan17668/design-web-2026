<body class="min-h-screen bg-base-200 flex items-center justify-center p-6">

  <div id="app" class="card bg-base-100 shadow-2xl w-full max-w-md">
    <div class="card-body">

      <h1 class="card-title justify-center text-2xl mb-2">Calculadora Vue</h1>

      <!-- Visualizar -->
      <div class="bg-base-300 rounded-box p-4 mb-4 min-h-16 flex items-center justify-end">
        <div class="text-3xl font-mono font-bold break-all">{{ display }}</div>
      </div>

      <!-- Acao -->
      <div class="grid grid-cols-4 gap-2">

        <!-- Linha 1 -->
        <button class="btn btn-error text-xl" @click="clear">C</button>
        <button class="btn btn-warning text-xl" @click="square">x²</button>
        <button class="btn btn-warning text-xl" @click="setOperator('^')">x^y</button>
        <button class="btn btn-primary text-xl" @click="setOperator('/')">÷</button>

        <!-- Linha 2 -->
        <button class="btn btn-ghost text-xl" @click="appendDigit('7')">7</button>
        <button class="btn btn-ghost text-xl" @click="appendDigit('8')">8</button>
        <button class="btn btn-ghost text-xl" @click="appendDigit('9')">9</button>
        <button class="btn btn-primary text-xl" @click="setOperator('*')">×</button>

        <!-- Linha 3 -->
        <button class="btn btn-ghost text-xl" @click="appendDigit('4')">4</button>
        <button class="btn btn-ghost text-xl" @click="appendDigit('5')">5</button>
        <button class="btn btn-ghost text-xl" @click="appendDigit('6')">6</button>
        <button class="btn btn-primary text-xl" @click="setOperator('-')">−</button>

        <!-- Linha 4 -->
        <button class="btn btn-ghost text-xl" @click="appendDigit('1')">1</button>
        <button class="btn btn-ghost text-xl" @click="appendDigit('2')">2</button>
        <button class="btn btn-ghost text-xl" @click="appendDigit('3')">3</button>
        <button class="btn btn-primary text-xl" @click="setOperator('+')">+</button>

        <!-- Linha 5 -->
        <button class="btn btn-ghost text-xl col-span-2" @click="appendDigit('0')">0</button>
        <button class="btn btn-ghost text-xl" @click="appendDecimal">.</button>
        <button class="btn btn-accent text-xl" @click="calculate">=</button>

      </div>
    </div>
  </div>
